<!DOCTYPE html>
<html>
<head>
<title>Edit Profile - Velix</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
text-align:center;
}

header{
background:#0f172a;
color:white;
padding:40px;
}

.card{
background:white;
max-width:600px;
margin:20px auto;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
padding:12px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

a{
display:block;
margin-top:20px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}
</style>

</head>

<body>

<header>
<h1>✏ Edit Profile</h1>
<p>Update your provider information.</p>
</header>

<div class="card">

<input type="text" placeholder="Business Name">

<input type="text" placeholder="Owner Name">

<input type="tel" placeholder="Phone Number">

<input type="email" placeholder="Email Address">

<input type="text" placeholder="Location">

<br><br>

<button>💾 Save Profile</button>

<a href="provider-profile.html">⬅ Back to My Profile</a>

</div>

</body>
</html>
