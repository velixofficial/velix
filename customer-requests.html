<!DOCTYPE html>
<html>
<head>
<title>Customer Requests - Velix</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
text-align:center;
}

header{
background:#0f172a;
color:white;
padding:40px;
}

.card{
background:white;
max-width:600px;
margin:20px auto;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.request{
border:1px solid #ddd;
padding:15px;
margin:15px 0;
border-radius:10px;
text-align:left;
}

.request h3{
text-align:center;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
margin:5px;
}

.accept{
background:#16a34a;
}

.decline{
background:#dc2626;
}

.back{
display:block;
margin-top:20px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}

#requestStatus{
text-align:center;
font-weight:bold;
margin-top:15px;
}
</style>

</head>

<body>

<header>
<h1>📩 Customer Requests</h1>
<p>Requests from customers will appear here.</p>
</header>

<div class="card">

<div class="request" id="requestDisplay">

<h3>No customer requests yet</h3>
<p>When customers contact you through Velix, their requests will appear here.</p>

</div>

<a class="back" href="provider-dashboard.html">
⬅ Back to Dashboard
</a>

</div>

<script>

const customerName = localStorage.getItem("velixCustomerName");
const customerPhone = localStorage.getItem("velixCustomerPhone");
const requestedService = localStorage.getItem("velixRequestedService");
const requestMessage = localStorage.getItem("velixRequestMessage");
const requestLocation = localStorage.getItem("velixRequestLocation");

function acceptRequest(){

localStorage.setItem("velixRequestStatus","Accepted");

document.getElementById("requestStatus").innerHTML =
"✅ Request Accepted";

}

function declineRequest(){

localStorage.setItem("velixRequestStatus","Declined");

document.getElementById("requestStatus").innerHTML =
"❌ Request Declined";

}

if(customerName){

const savedStatus = localStorage.getItem("velixRequestStatus");

document.getElementById("requestDisplay").innerHTML = `

<h3>📩 New Customer Request</h3>

<p><strong>Customer:</strong><br>
${customerName}</p>

<p><strong>Phone:</strong><br>
${customerPhone || "Not provided"}</p>

<p><strong>Service Needed:</strong><br>
${requestedService || "Not provided"}</p>

<p><strong>Message:</strong><br>
${requestMessage || "Not provided"}</p>

<p><strong>Location:</strong><br>
${requestLocation || "Not provided"}</p>

<div style="text-align:center;">

<button class="accept" onclick="acceptRequest()">
✅ Accept Request
</button>

<button class="decline" onclick="declineRequest()">
❌ Decline Request
</button>

<p id="requestStatus">
${savedStatus ? savedStatus : ""}
</p>

</div>

`;

}

</script>

</body>
</html>
