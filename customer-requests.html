
<!DOCTYPE html>
<html>
<head>

<title>Customer Requests - Velix</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
background:#0f172a;
color:white;
padding:30px 20px;
border-radius:15px;
text-align:center;
}

.card{
background:white;
padding:25px;
margin-top:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.request{
border:1px solid #cbd5e1;
padding:20px;
border-radius:12px;
margin-top:15px;
background:#f8fafc;
}

.request h2{
margin-top:0;
color:#0f172a;
}

.info{
margin:10px 0;
}

.status{
display:inline-block;
padding:7px 12px;
border-radius:20px;
font-weight:bold;
}

.pending{
background:#fef3c7;
color:#92400e;
}

.accepted{
background:#dcfce7;
color:#166534;
}

.progress{
background:#dbeafe;
color:#1e40af;
}

.completed{
background:#e0e7ff;
color:#3730a3;
}

.declined{
background:#fee2e2;
color:#991b1b;
}

button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.accept{
background:#16a34a;
color:white;
}

.decline{
background:#dc2626;
color:white;
}

.start{
background:#2563eb;
color:white;
}

.complete{
background:#7c3aed;
color:white;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
font-weight:bold;
text-decoration:none;
}

.empty{
text-align:center;
padding:30px 10px;
color:#64748b;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📩 Customer Requests</h1>

<p>Requests from customers will appear here.</p>

</div>


<div class="card">

<div id="requests"></div>

</div>


<a class="back" href="provider-dashboard.html">
⬅ Back to Dashboard
</a>

</div>


<script>

function loadRequests(){

const savedRequest =
localStorage.getItem("velixCustomerRequest");

const requestsDiv =
document.getElementById("requests");


if(!savedRequest){

requestsDiv.innerHTML = `

<div class="empty">

<h2>No customer requests yet</h2>

<p>
When customers contact you through Velix,
their requests will appear here.
</p>

</div>

`;

return;

}


const request =
JSON.parse(savedRequest);


let statusClass = "pending";

if(request.status === "Accepted"){
statusClass = "accepted";
}

if(request.status === "In Progress"){
statusClass = "progress";
}

if(request.status === "Completed"){
statusClass = "completed";
}

if(request.status === "Declined"){
statusClass = "declined";
}


let actionButtons = "";


if(request.status === "Pending"){

actionButtons = `

<button class="accept"
onclick="acceptRequest()">
✅ Accept Request
</button>

<button class="decline"
onclick="declineRequest()">
❌ Decline Request
</button>

`;

}


if(request.status === "Accepted"){

actionButtons = `

<button class="start"
onclick="startService()">
▶️ Start Service
</button>

`;

}


if(request.status === "In Progress"){

actionButtons = `

<button class="complete"
onclick="completeService()">
✅ Mark as Completed
</button>

`;


}


requestsDiv.innerHTML = `

<h2>Service Request</h2>

<div class="request">

<h2>📩 Customer Request</h2>

<p class="info">
👤 <strong>Customer:</strong><br>
${request.name}
</p>

<p class="info">
📞 <strong>Phone:</strong><br>
${request.phone}
</p>

<p class="info">
🔧 <strong>Service:</strong><br>
${request.service}
</p>

<p class="info">
📝 <strong>What they need:</strong><br>
${request.description}
</p>

<p class="info">
📍 <strong>Location:</strong><br>
${request.location}
</p>

<p class="info">
👷 <strong>Provider:</strong><br>
${request.provider}
</p>

<p class="info">
📅 <strong>Request Date:</strong><br>
${request.date}
</p>

<p>

<strong>Status:</strong><br><br>

<span class="status ${statusClass}">
${request.status}
</span>

</p>

${actionButtons}

</div>

`;

}


function updateRequestStatus(newStatus){

const savedRequest =
localStorage.getItem("velixCustomerRequest");

if(savedRequest){

const request =
JSON.parse(savedRequest);

request.status = newStatus;

localStorage.setItem(
"velixCustomerRequest",
JSON.stringify(request)
);

}

loadRequests();

}


function acceptRequest(){

updateRequestStatus("Accepted");

alert("Request accepted successfully.");

}


function declineRequest(){

updateRequestStatus("Declined");

alert("Request declined.");

}


function startService(){

updateRequestStatus("In Progress");

alert("Service has been started.");

}


function completeService(){

updateRequestStatus("Completed");

alert("Service has been marked as completed.");

}


loadRequests();

</script>

</body>
</html>
