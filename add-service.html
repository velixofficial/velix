<!DOCTYPE html>
<html>
<head>
<title>Add New Service - Velix</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
text-align:center;
}

header{
background:#0f172a;
color:white;
padding:40px;
}

.card{
background:white;
max-width:600px;
margin:20px auto;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

input, textarea{
width:90%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

textarea{
height:120px;
resize:none;
}

button{
padding:12px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

a{
display:block;
margin-top:20px;
text-decoration:none;
color:#2563eb;
font-weight:bold;
}
</style>

</head>

<body>

<header>
<h1>🛠 Add New Service</h1>
<p>Tell customers about the service you offer.</p>
</header>

<div class="card">

<input type="text" id="serviceName" placeholder="Service Name">

<textarea id="serviceDescription" placeholder="Describe your service"></textarea>

<input type="text" id="serviceLocation" placeholder="Service Location">

<input type="number" id="servicePrice" placeholder="Price">

<br><br>

<button onclick="saveService()">💾 Save Service</button>

<a href="my-services.html">⬅ Back to My Services</a>

</div>

<script>

function saveService(){

const serviceName = document.getElementById("serviceName").value;
const serviceDescription = document.getElementById("serviceDescription").value;
const serviceLocation = document.getElementById("serviceLocation").value;
const servicePrice = document.getElementById("servicePrice").value;

localStorage.setItem("velixServiceName", serviceName);
localStorage.setItem("velixServiceDescription", serviceDescription);
localStorage.setItem("velixServiceLocation", serviceLocation);
localStorage.setItem("velixServicePrice", servicePrice);

alert("✅ Service saved successfully!");

window.location.href = "my-services.html";

}

</script>

</body>
</html>
