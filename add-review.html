<!DOCTYPE html>
<html>

<head>

<title>Leave a Review - Velix</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
background:#0f172a;
color:white;
padding:30px 20px;
border-radius:15px;
text-align:center;
}

.card{
background:white;
padding:25px;
margin-top:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.provider{
background:#eff6ff;
border:1px solid #bfdbfe;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

label{
display:block;
margin-top:18px;
font-weight:bold;
color:#334155;
}

select,
textarea{
width:100%;
box-sizing:border-box;
padding:12px;
margin-top:8px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:15px;
}

textarea{
height:130px;
resize:vertical;
}

button{
width:100%;
padding:13px;
margin-top:20px;
background:#7c3aed;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
font-weight:bold;
text-decoration:none;
}

</style>

</head>


<body>

<div class="container">


<div class="header">

<h1>⭐ Leave a Review</h1>

<p>Share your experience with this provider.</p>

</div>


<div class="card">


<div class="provider">

<h3>👷 Service Provider</h3>

<p id="providerName">
Loading provider...
</p>

<p id="serviceName">
Loading service...
</p>

</div>


<form onsubmit="submitReview(event)">


<label for="rating">
Your Rating
</label>

<select id="rating" required>

<option value="">
Select a rating
</option>

<option value="5">
⭐⭐⭐⭐⭐ — Excellent
</option>

<option value="4">
⭐⭐⭐⭐ — Very Good
</option>

<option value="3">
⭐⭐⭐ — Good
</option>

<option value="2">
⭐⭐ — Fair
</option>

<option value="1">
⭐ — Poor
</option>

</select>


<label for="review">
Your Review
</label>

<textarea
id="review"
placeholder="Tell us about your experience..."
required
></textarea>


<button type="submit">

⭐ Submit Review

</button>


</form>


<a href="my-requests.html">

<button class="secondary">

⬅ Back to My Requests

</button>

</a>


</div>

</div>


<script>

function loadProvider(){

const savedRequest =
localStorage.getItem("velixCustomerRequest");


if(!savedRequest){

document.getElementById("providerName").textContent =
"No completed request found.";

document.getElementById("serviceName").textContent =
"Please return to My Requests.";

return;

}


const request =
JSON.parse(savedRequest);


document.getElementById("providerName").innerHTML =
"👤 <strong>Provider:</strong> " + request.provider;


document.getElementById("serviceName").innerHTML =
"🔧 <strong>Service:</strong> " + request.service;

}


function submitReview(event){

event.preventDefault();


const savedRequest =
localStorage.getItem("velixCustomerRequest");


if(!savedRequest){

alert("No completed service request found.");

return;

}


const request =
JSON.parse(savedRequest);


if(request.status !== "Completed"){

alert("You can only review a completed service.");

return;

}


const review = {

provider: request.provider,

service: request.service,

customer: request.name,

rating: document.getElementById("rating").value,

review: document.getElementById("review").value,

date: new Date().toLocaleString()

};


localStorage.setItem(
"velixProviderReview",
JSON.stringify(review)
);


alert("Thank you! Your review has been submitted.");

window.location.href = "reviews.html";

}


loadProvider();

</script>

</body>

</html>
