<!DOCTYPE html>
<html>
<head>

<title>Customer Request - Velix</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f8fafc;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
background:#0f172a;
color:white;
padding:30px 20px;
border-radius:15px;
text-align:center;
}

.card{
background:white;
margin-top:20px;
padding:25px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.selected{
background:#eff6ff;
border:1px solid #bfdbfe;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.selected h3{
margin-top:0;
color:#1d4ed8;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
color:#334155;
}

input,
textarea{
width:100%;
box-sizing:border-box;
padding:12px;
margin-top:7px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
padding:13px;
margin-top:20px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.secondary{
background:#e2e8f0;
color:#0f172a;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#2563eb;
font-weight:bold;
text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📩 Customer Request</h1>

<p>Request a service from a Velix provider.</p>

</div>


<div class="card">

<div class="selected">

<h3>Selected Provider</h3>

<p>
👤 <strong>Provider:</strong><br>
Velix Home Repairs Provider
</p>

<p>
🔧 <strong>Service:</strong><br>
General Home Repairs
</p>

</div>


<form onsubmit="sendRequest(event)">

<label>Your Name</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required
>


<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="Enter your phone number"
required
>


<label>Service Needed</label>

<input
type="text"
id="service"
value="General Home Repairs"
required
>


<label>Describe What You Need</label>

<textarea
id="description"
placeholder="Tell the provider what you need help with..."
required
></textarea>


<label>Your Location</label>

<input
type="text"
id="location"
placeholder="Enter your location"
required
>


<button type="submit">
📩 Send Request
</button>

</form>


<a href="provider-profile.html">

<button class="secondary">
⬅ Back to Provider Profile
</button>

</a>

</div>

</div>


<script>
function sendRequest(event) {
    event.preventDefault();

    const request = {
        id: Date.now().toString(),
        provider: "Velix Home Repairs Provider",
        service: document.getElementById("service").value,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        description: document.getElementById("description").value,
        location: document.getElementById("location").value,
        status: "Pending",
        date: new Date().toLocaleString()
    };

    let requests = [];

    try {
        requests = JSON.parse(
            localStorage.getItem("velixCustomerRequests")
        ) || [];

        if (!Array.isArray(requests)) requests = [];
    } catch (error) {
        requests = [];
    }

    // Keep any older request already saved by the previous version.
    const oldRequest = localStorage.getItem("velixCustomerRequest");

    if (oldRequest) {
        try {
            const previous = JSON.parse(oldRequest);

            if (previous && !requests.some(r => r.id === previous.id)) {
                previous.id = previous.id || Date.now().toString();
                requests.push(previous);
            }
        } catch (error) {}
    }

    requests.push(request);

    localStorage.setItem(
        "velixCustomerRequests",
        JSON.stringify(requests)
    );

    alert("Your request has been saved successfully!");

    window.location.href = "my-requests.html";
}
</script>    

</body>
</html>
